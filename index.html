<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>疑问句练习 / 疑問句練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFE8D8;
    --paper-line:#DCD2B8;
    --ink:#2B2A28;
    --ink-soft:#5A564C;
    --seal:#B7312C;
    --seal-dark:#8C2320;
    --seal-tint:#F3DAD6;
    --indigo:#33546A;
    --indigo-dark:#233C4B;
    --indigo-tint:#DCE6EA;
    --gold:#B08D57;
    --card:#FBF8F0;
    --good:#3E6B3A;
    --good-tint:#E1EEDC;
    --bad:#A13B2E;
    --bad-tint:#F6DDD8;
    --rec:#7A2E2A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans SC', sans-serif;
    background:
      linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/40px 40px,
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px) 0 0/40px 40px,
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding:36px 18px 70px;
  }
  .wrap{max-width:720px;margin:0 auto;}
  .hidden{display:none !important;}

  .seal-icon{
    width:72px;height:72px;border-radius:12px;
    background:var(--seal);
    color:#fdf3ec;
    display:flex;align-items:center;justify-content:center;
    font-family:'Noto Serif SC', serif;font-weight:700;font-size:34px;
    margin:0 auto 18px;
    box-shadow:0 0 0 2px var(--card), 0 0 0 3px var(--seal);
  }
  h1{
    font-family:'Noto Serif SC', serif;
    font-weight:700;
    font-size:36px;
    text-align:center;
    margin:0 0 28px;
    letter-spacing:.02em;
  }

  .grid{display:grid;gap:16px;grid-template-columns:1fr;}
  .grid.cols-2{grid-template-columns:repeat(2,1fr);}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  @media (max-width:560px){ .grid.cols-3{grid-template-columns:1fr;} }

  .choice-card{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:16px;
    padding:28px 18px;
    text-align:center;
    cursor:pointer;
    transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  .choice-card:hover{ border-color:var(--gold); transform:translateY(-2px); box-shadow:0 6px 16px rgba(43,42,40,.08); }
  .choice-card .lv{
    font-family:'Noto Serif SC', serif;
    font-weight:700;
    font-size:28px;
    margin:0 0 8px;
  }
  .choice-card.script-card .lv{ font-size:38px; margin:0; }
  .choice-card .desc{ font-size:15px; color:var(--ink-soft); line-height:1.6; }

  .stamp{
    display:inline-block;
    font-size:14px;
    font-weight:700;
    padding:5px 14px;
    border-radius:999px;
    letter-spacing:.05em;
  }
  .stamp.wh{ background:var(--seal-tint); color:var(--seal-dark); }
  .stamp.yn{ background:var(--indigo-tint); color:var(--indigo-dark); }

  .backbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:22px; font-size:16px; color:var(--ink-soft);
  }
  .backbar button{
    background:none;border:none;color:var(--indigo-dark);
    font-size:16px;font-weight:700;cursor:pointer;padding:6px 0;font-family:inherit;
  }
  .backbar button:hover{ text-decoration:underline; }

  .progress-row{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:18px;
  }
  .progress-track{
    flex:1;height:8px;border-radius:4px;background:var(--paper-line);
    margin:0 16px;overflow:hidden;
  }
  .progress-fill{height:100%;background:var(--seal);border-radius:4px;transition:width .25s ease;}
  .score-pill{
    font-size:15px;color:var(--ink-soft);white-space:nowrap;font-weight:600;
  }

  .exercise-card{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:18px;
    padding:32px 26px 26px;
    position:relative;
  }
  .exercise-card::before{
    content:"";
    position:absolute; top:16px; right:18px;
    width:30px;height:30px;
    border:1.5px solid var(--seal);
    border-radius:4px;
    opacity:.35;
  }
  .statement{
    font-family:'Noto Serif SC', serif;
    font-size:30px;
    line-height:2;
    margin:10px 0 26px;
  }
  .statement .hint-inline{
    font-family:'Noto Sans SC', sans-serif;
    font-size:18px;
    font-weight:400;
    color:var(--ink-soft);
  }
  .statement .target{
    border-bottom:3px solid var(--seal);
    padding-bottom:1px;
    color:var(--seal-dark);
    font-weight:700;
  }

  .qword-grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:6px;
  }
  .qword-btn{
    font-family:'Noto Sans SC', sans-serif;
    font-size:21px;
    padding:16px 12px;
    border-radius:12px;
    border:1.5px solid var(--paper-line);
    background:#fff;
    cursor:pointer;
    transition:border-color .12s ease, background .12s ease;
  }
  .qword-btn:hover{ border-color:var(--gold); }
  .qword-btn.correct{ background:var(--good-tint); border-color:var(--good); color:var(--good); font-weight:700; }
  .qword-btn.wrong{ background:var(--bad-tint); border-color:var(--bad); color:var(--bad); }
  .qword-btn:disabled{ cursor:default; opacity:.9; }

  textarea, input[type=text]{
    width:100%; font-family:'Noto Sans SC', sans-serif; font-size:20px;
    padding:14px 16px; border-radius:12px; border:1.5px solid var(--paper-line);
    background:#fff; resize:none; margin-bottom:10px;
  }
  textarea:focus, input[type=text]:focus{ outline:none; border-color:var(--gold); }

  .input-row{ display:flex; gap:10px; align-items:flex-start; }
  .input-row textarea{ flex:1; }
  .mic-btn{
    flex-shrink:0;
    font-family:inherit; font-size:16px; font-weight:700;
    padding:14px 16px; border-radius:12px; border:1.5px solid var(--paper-line);
    background:#fff; cursor:pointer; white-space:nowrap;
  }
  .mic-btn:hover{ border-color:var(--gold); }
  .mic-btn.listening{ background:var(--bad-tint); border-color:var(--rec); color:var(--rec); }
  .mic-btn:disabled{ opacity:.4; cursor:not-allowed; }

  .btn-row{ display:flex; gap:12px; flex-wrap:wrap; margin-top:16px; }
  .btn{
    font-family:inherit; font-size:17px; font-weight:700;
    padding:13px 22px; border-radius:999px; border:1px solid var(--ink);
    background:var(--ink); color:#fdf9f0; cursor:pointer;
  }
  .btn.secondary{ background:#fff; color:var(--ink); }
  .btn.seal{ background:var(--seal); border-color:var(--seal); }
  .btn:disabled{ opacity:.4; cursor:default; }

  .reveal{
    margin-top:18px; padding-top:18px; border-top:1px dashed var(--paper-line);
  }
  .reveal .label{ font-size:14px; color:var(--ink-soft); margin-bottom:6px; }
  .reveal .answer{
    font-family:'Noto Serif SC', serif; font-size:26px; line-height:1.8;
    color:var(--indigo-dark); margin-bottom:12px;
  }
  .feedback{
    font-size:16px; padding:10px 14px; border-radius:10px; margin-bottom:12px; font-weight:600;
  }
  .feedback.good{ background:var(--good-tint); color:var(--good); }
  .feedback.bad{ background:var(--bad-tint); color:var(--bad); }
  .feedback.note{ background:var(--indigo-tint); color:var(--indigo-dark); }

  .speak-btn{
    display:inline-flex; align-items:center; gap:8px;
    background:#fff; border:1.5px solid var(--paper-line);
    border-radius:999px; padding:10px 18px; font-size:16px; cursor:pointer;
  }
  .speak-btn:hover{ border-color:var(--gold); }

  .resume-note{
    text-align:center; font-size:14px; color:var(--ink-soft); margin-bottom:12px;
  }

  .summary{
    text-align:center; padding:50px 20px;
  }
  .summary .big{
    font-family:'Noto Serif SC', serif; font-size:52px; font-weight:700;
    color:var(--seal); margin-bottom:8px;
  }
  .summary .subtitle-lite{
    color:var(--ink-soft); font-size:18px; margin:0 0 30px;
  }

  #yn-error{ font-size:15px;color:var(--bad);margin:-2px 0 10px; }

  .site-footer{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    opacity:.65;
    margin-top:40px;
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- SCREEN: SCRIPT SELECT -->
  <div id="screen-script">
    <div class="seal-icon">問</div>
    <h1>疑问句练习 / 疑問句練習</h1>
    <div class="grid cols-2">
      <div class="choice-card script-card" onclick="chooseScript('simp')"><div class="lv">简体</div></div>
      <div class="choice-card script-card" onclick="chooseScript('trad')"><div class="lv">繁體</div></div>
    </div>
  </div>

  <!-- SCREEN: HOME -->
  <div id="screen-home" class="hidden">
    <div class="backbar">
      <button onclick="goScript()" id="back-to-script-btn"></button>
      <span></span>
    </div>
    <div class="seal-icon">問</div>
    <h1 id="home-title"></h1>
    <div class="grid cols-3" id="level-grid"></div>
  </div>

  <!-- SCREEN: MODE -->
  <div id="screen-mode" class="hidden">
    <div class="backbar">
      <button onclick="goHome()" id="back-to-level-btn"></button>
      <span id="mode-level-label"></span>
    </div>
    <div class="seal-icon">問</div>
    <h1 id="mode-title"></h1>
    <div class="grid" id="mode-grid"></div>
  </div>

  <!-- SCREEN: EXERCISE -->
  <div id="screen-exercise" class="hidden">

      <span id="ex-level-label"></span>
    </div>

      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

    </div>
    <div class="resume-note hidden" id="resume-note"></div>
    <div class="exercise-card" id="exercise-card"></div>
  </div>

  <!-- SCREEN: SUMMARY -->
  <div id="screen-summary" class="hidden">
    <div class="summary">
      <div class="seal-icon" id="summary-seal"></div>
      <div class="big" id="summary-score"></div>
      <p class="subtitle-lite" id="summary-text"></p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn seal" id="again-btn" onclick="restartSameMode()"></button>
        <button class="btn secondary" id="switch-mode-btn" onclick="goMode()"></button>
        <button class="btn secondary" id="switch-level-btn" onclick="goHome()"></button>
      </div>
    </div>
  </div>

  <div class="site-footer">Shelleytaiwan製作2026</div>

</div>

/* ---------------- STATE ---------------- */
let state = { script:null, levelId:null, mode:null, items:[], idx:0, correct:0, answered:false, voice:null, recognition:null, listening:false, resumed:false };

function T(){ return state.script==='trad' ? BLOB.UI_TRAD : BLOB.UI_SIMP; }
function D(){ return state.script==='trad' ? BLOB.DATA_TRAD : BLOB.DATA_SIMP; }
function LV(){ return state.script==='trad' ? BLOB.LEVELS_TRAD : BLOB.LEVELS_SIMP; }
function QCAT(){ return state.script==='trad' ? BLOB.QCAT_TRAD : BLOB.QCAT_SIMP; }
function fmt(str, params){ return str.replace(/\{(\w+)\}/g, (_,k)=> params[k]); }

/* ---------------- PERSISTENT PROGRESS (window.storage) ---------------- */
function progressKey(levelId, mode){
  return 'progress:'+state.script+':'+levelId+':'+mode;
}
async function saveProgress(){
  if (!window.storage) return;
  const key = progressKey(state.levelId, state.mode);
  try{
    await window.storage.set(key, JSON.stringify({items: state.items, idx: state.idx, correct: state.correct}), false);
  }catch(e){ /* ignore storage errors */ }
}
async function loadProgress(levelId, mode){
  if (!window.storage) return null;
  const key = progressKey(levelId, mode);
  try{
    const res = await window.storage.get(key, false);
    if (res && res.value) return JSON.parse(res.value);
  }catch(e){ /* no saved progress */ }
  return null;
}
async function clearProgress(levelId, mode){
  if (!window.storage) return;
  const key = progressKey(levelId, mode);
  try{ await window.storage.delete(key, false); }catch(e){ /* ignore */ }
}

/* ---------------- TTS ---------------- */
function pickVoice(){
  if (!('speechSynthesis' in window)) return;
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return;
  if (state.script === 'trad'){
    state.voice = voices.find(v => /Mei-?Jia|美佳|美嘉/i.test(v.name)) ||
                  voices.find(v => v.lang === 'zh-TW') ||
                  voices.find(v => v.lang && v.lang.startsWith('zh'));
  } else {
    state.voice = voices.find(v => /Ting-?Ting|婷婷/i.test(v.name)) ||
                  voices.find(v => v.lang === 'zh-CN') ||
                  voices.find(v => v.lang && v.lang.startsWith('zh'));
  }
}
if ('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text){
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  pickVoice();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = state.script==='trad' ? 'zh-TW' : 'zh-CN';
  u.rate = 0.68;
  u.pitch = 1;
  if (state.voice) u.voice = state.voice;
  speechSynthesis.speak(u);
}

/* ---------------- SPEECH INPUT (mic) ---------------- */
function speechInputSupported(){
  return ('webkitSpeechRecognition' in window) || ('SpeechRecognition' in window);
}
function toggleMic(btnEl, textareaEl){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ return; }
  if (state.listening){
    if (state.recognition) state.recognition.stop();
    return;
  }
  const rec = new SR();
  rec.lang = state.script==='trad' ? 'zh-TW' : 'zh-CN';
  rec.interimResults = true;
  rec.continuous = false;
  rec.onstart = ()=>{
    state.listening = true;
    btnEl.classList.add('listening');
    btnEl.textContent = T().mic_listening;
  };
  rec.onresult = (e)=>{
    let transcript = '';
    for (let i=0;i<e.results.length;i++){ transcript += e.results[i][0].transcript; }
    textareaEl.value = transcript;
  };
  rec.onerror = ()=>{
    state.listening = false;
    btnEl.classList.remove('listening');
    btnEl.textContent = T().mic_start;
  };
  rec.onend = ()=>{
    state.listening = false;
    btnEl.classList.remove('listening');
    btnEl.textContent = T().mic_start;
  };
  state.recognition = rec;
  rec.start();
}

function showScreen(id){
  ['screen-script','screen-home','screen-mode','screen-exercise','screen-summary'].forEach(s=>{
    document.getElementById(s).classList.toggle('hidden', s!==id);
  });
}
function chooseScript(script){
  state.script = script;
  pickVoice();
  applyStaticText();
  renderHome();
  showScreen('screen-home');
}
function goScript(){ if ('speechSynthesis' in window) speechSynthesis.cancel(); showScreen('screen-script'); }
function goHome(){ if ('speechSynthesis' in window) speechSynthesis.cancel(); renderHome(); showScreen('screen-home'); }
function goMode(){ if ('speechSynthesis' in window) speechSynthesis.cancel(); renderMode(state.levelId); showScreen('screen-mode'); }

  document.getElementById('home-title').textContent = t.brand;
  document.getElementById('back-to-level-btn').textContent = t.back_to_level;
  document.getElementById('back-to-mode-btn').textContent = t.back_to_mode;
  document.getElementById('summary-seal').textContent = t.summary_seal;
  document.getElementById('again-btn').textContent = t.again_btn;
  document.getElementById('switch-mode-btn').textContent = t.switch_mode_btn;
  document.getElementById('switch-level-btn').textContent = t.switch_level_btn;
}

/* ---------------- HOME ---------------- */
function renderHome(){
  const grid = document.getElementById('level-grid');
  grid.innerHTML = '';
  LV().forEach(lv=>{
    const el = document.createElement('div');
    el.className = 'choice-card';
    el.innerHTML = '<div class="lv">'+lv.name+'</div>';
    el.onclick = ()=>{ state.levelId = lv.id; renderMode(lv.id); showScreen('screen-mode'); };
    grid.appendChild(el);
  });
}

/* ---------------- MODE ---------------- */
function renderMode(levelId){
  const t = T();
  const lv = LV().find(l=>l.id===levelId);
  document.getElementById('mode-title').textContent = lv.name;
  document.getElementById('mode-level-label').textContent = lv.name;
  document.getElementById('ex-level-label').textContent = lv.name;
  const grid = document.getElementById('mode-grid');
  grid.innerHTML = '';
  const modes = [
    {id:'wh', label:t.mode_wh_label, desc:t.mode_wh_desc, stamp:t.mode_wh_stamp, cls:'wh'},
    {id:'yn', label:t.mode_yn_label, desc:t.mode_yn_desc, stamp:t.mode_yn_stamp, cls:'yn'},
    {id:'mix', label:t.mode_mix_label, desc:t.mode_mix_desc, stamp:t.mode_mix_stamp, cls:'wh'}
  ];
  modes.forEach(m=>{
    const el = document.createElement('div');
    el.className = 'choice-card';
    el.style.textAlign = 'left';
    el.innerHTML = '<div class="lv" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">'+m.label+'<span class="stamp '+m.cls+'">'+m.stamp+'</span></div><div class="desc">'+m.desc+'</div>';
    el.onclick = ()=> startExercise(levelId, m.id);
    grid.appendChild(el);
  });
}

/* ---------------- EXERCISE SETUP ---------------- */
function shuffle(arr){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function buildItems(levelId, mode){
  const bank = D()[levelId];
  if (mode==='wh') return bank.wh.map(x=>Object.assign({}, x, {kind:'wh'}));
  if (mode==='yn') return bank.yn.map(x=>Object.assign({}, x, {kind:'yn'}));
  return [].concat(
    bank.wh.map(x=>Object.assign({}, x, {kind:'wh'})),
    bank.yn.map(x=>Object.assign({}, x, {kind:'yn'}))
  );
}
async function startExercise(levelId, mode){
  state.levelId = levelId;
  state.mode = mode;
  state.resumed = false;
  const saved = await loadProgress(levelId, mode);
  if (saved && saved.items && saved.idx < saved.items.length){
    state.items = saved.items;
    state.idx = saved.idx;
    state.correct = saved.correct;
    state.resumed = true;
  } else {
    state.items = shuffle(buildItems(levelId, mode));
    state.idx = 0;
    state.correct = 0;
    await saveProgress();
  }
  showScreen('screen-exercise');
  renderExercise();
}
async function restartSameMode(){
  await clearProgress(state.levelId, state.mode);
  startExercise(state.levelId, state.mode);
}

/* ---------------- EXERCISE RENDER ---------------- */
function getDistractors(correctWord, correctCat, n){
  const cats = QCAT();
  const otherCats = Object.keys(cats).filter(c=>c!==correctCat);
  const shuffledCats = shuffle(otherCats);
  const picks = [];
  for (const c of shuffledCats){
    if (picks.length>=n) break;
    const words = cats[c].filter(w=>w!==correctWord);
    if (words.length){ picks.push(words[Math.floor(Math.random()*words.length)]); }
  }
  return picks;
}
function plainStatement(s){
  return s.replace(/【/g,'').replace(/】/g,'');
}

function renderExercise(){
  const t = T();
  const item = state.items[state.idx];
  document.getElementById('progress-label').textContent = fmt(t.progress_of, {a: state.idx+1, b: state.items.length});
  document.getElementById('score-label').textContent = fmt(t.score_answered, {n: state.correct});
  document.getElementById('progress-fill').style.width = (state.idx/state.items.length*100)+'%';
  state.answered = false;

  const resumeEl = document.getElementById('resume-note');
  if (state.resumed && state.idx>0){
    resumeEl.textContent = t.resumed_note;
    resumeEl.classList.remove('hidden');
  } else {
    resumeEl.classList.add('hidden');
  }

  const card = document.getElementById('exercise-card');

  if (item.kind==='wh'){
    const statementHtml = item.s.replace('【','<span class="target">').replace('】','</span>');
    const options = shuffle([item.q].concat(getDistractors(item.q, item.cat, 3)));
    card.innerHTML =
      '<div class="statement">'+statementHtml+'</div>'+
      '<div class="qword-grid" id="qword-grid"></div>'+
      '<div id="reveal-area"></div>';
    const grid = document.getElementById('qword-grid');
    options.forEach(opt=>{
      const btn = document.createElement('button');
      btn.className = 'qword-btn';
      btn.textContent = opt;
      btn.onclick = ()=> handleWhAnswer(opt, item, btn, grid);
      grid.appendChild(btn);
    });
  } else {
    const stampMap = {yn: t.stamp_yn, an: t.stamp_an, xz: t.stamp_xz};
    const stampText = stampMap[item.type] || t.stamp_yn;
    const stampCls = item.type==='yn' ? 'yn' : 'wh';
    const micSupported = speechInputSupported();
    card.innerHTML =
      '<span class="stamp '+stampCls+'">'+stampText+'</span>'+
      '<div class="statement">'+plainStatement(item.s)+(item.hint ? ' <span class="hint-inline">'+item.hint+'</span>' : '')+'</div>'+
      '<div class="input-row">'+
        '<textarea id="yn-input" rows="2" placeholder="'+t.input_placeholder+'"></textarea>'+
        (micSupported ? '<button type="button" class="mic-btn" id="mic-btn">'+t.mic_start+'</button>' : '<button type="button" class="mic-btn" disabled>'+t.mic_unsupported+'</button>')+
      '</div>'+
      '<div class="btn-row">'+
        '<button class="btn seal" onclick="handleYnAnswer()">'+t.check_answer+'</button>'+
      '</div>'+
      '<div id="reveal-area"></div>';
    if (micSupported){
      const micBtn = document.getElementById('mic-btn');
      const ta = document.getElementById('yn-input');
      micBtn.onclick = ()=> toggleMic(micBtn, ta);
    }
  }

  /* auto-read the prompt sentence aloud so students without pinyin still know how to say it */
  speak(plainStatement(item.s));
}

function normalize(s){
  return s.replace(/[，。？！、\s]/g,'').replace(/[?]/g,'').trim();
}

function handleWhAnswer(chosen, item, btnEl, grid){
  if (state.answered) return;
  state.answered = true;
  const buttons = grid.querySelectorAll('.qword-btn');
  buttons.forEach(b=>{
    b.disabled = true;
    if (b.textContent === item.q) b.classList.add('correct');
    else if (b === btnEl) b.classList.add('wrong');
  });
  const isCorrect = chosen === item.q;
  if (isCorrect) state.correct++;
  const t = T();
  const msg = isCorrect ? t.correct_full : (t.wrong_full_prefix + item.q + t.wrong_full_suffix);
  showReveal(item.full, msg, isCorrect, false);
}

function handleYnAnswer(){
  if (state.answered) return;
  const t = T();
  const input = document.getElementById('yn-input');
  const val = input.value.trim();
  if (!val){
    let err = document.getElementById('yn-error');
    if (!err){
      err = document.createElement('div');
      err.id = 'yn-error';
      input.insertAdjacentElement('afterend', err);
    }
    err.textContent = t.need_input_error;
    return;
  }
  state.answered = true;
  const item = state.items[state.idx];
  const isMatch = normalize(val) === normalize(item.full);
  if (isMatch) state.correct++;
  const msg = isMatch ? t.match_good : t.match_soft;
  showReveal(item.full, msg, isMatch, true);
}

function showReveal(fullText, feedbackText, isCorrect, isSoft){
  const t = T();
  const area = document.getElementById('reveal-area');
  const cls = isSoft ? 'note' : (isCorrect ? 'good' : 'bad');
  area.innerHTML =
    '<div class="reveal">'+
      '<div class="feedback '+cls+'">'+feedbackText+'</div>'+
      '<div class="label">'+t.ref_label+'</div>'+
      '<div class="answer">'+fullText+'</div>'+
      '<button class="speak-btn" id="speak-btn">'+t.replay_btn+'</button>'+
      '<div class="btn-row">'+
        '<button class="btn secondary" id="next-btn">'+(state.idx+1 < state.items.length ? t.next_btn : t.result_btn)+'</button>'+
      '</div>'+
    '</div>';
  document.getElementById('speak-btn').onclick = ()=> speak(fullText);
  document.getElementById('next-btn').onclick = nextItem;
  speak(fullText);
  saveProgress();
}

async function nextItem(){
  state.idx++;
  state.resumed = false;
  if (state.idx >= state.items.length){
    await clearProgress(state.levelId, state.mode);
    showSummary();
  } else {
    await saveProgress();
    renderExercise();
  }
}

function showSummary(){
  const t = T();
  document.getElementById('progress-fill').style.width = '100%';
  const total = state.items.length;
  document.getElementById('summary-score').textContent = state.correct + ' / ' + total;
  const pct = Math.round((state.correct/total)*100);
  let text = t.summary_ok;
  if (pct===100) text = t.summary_perfect;
  else if (pct>=80) text = t.summary_great;
  else if (pct>=50) text = t.summary_ok;
  else text = t.summary_retry;
  document.getElementById('summary-text').textContent = text;
  showScreen('screen-summary');
}
</script>
